# Render @ROOT@ as the absolute hub service directory. Only music's existing port is proxied.
daemon off;
pid @ROOT@/state/nginx.pid;
error_log @ROOT@/state/nginx-error.log warn;
events { worker_connections 256; }
http {
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status';
    access_log @ROOT@/state/nginx-access.log safe;
    client_body_temp_path @ROOT@/state/client-body;
    proxy_temp_path @ROOT@/state/proxy;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    server {
        listen 0.0.0.0:4533;
        listen [::]:4533;
        client_max_body_size 4m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        location /hub/ {
            proxy_pass http://127.0.0.1:4534;
            add_header Cache-Control "no-store" always;
        }
        location / { proxy_pass http://127.0.0.1:4536; }
    }
}
