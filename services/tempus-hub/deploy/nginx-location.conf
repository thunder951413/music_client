# Include inside the existing Navidrome HTTPS server block.
# For a proxy on another LAN host, set HUB_LISTEN to the mini_server LAN address:4534.
# Do not log X-Tempus-Auth or request bodies; retain the existing safe URL log format.
location /hub/ {
    proxy_pass http://192.168.1.200:4534;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 4m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store" always;
}
