<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌单导入助手</title><style>
:root{color-scheme:dark;font:16px/1.65 system-ui;background:#101014;color:#ecebf1}body{max-width:880px;margin:56px auto;padding:0 24px}h1{font-size:34px;letter-spacing:-1px;margin:0}p{color:#b5b3bf}button{border:0;border-radius:22px;padding:13px 20px;font:inherit;background:#ff4b70;color:white;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.45;cursor:wait}a{color:#ff8da5}article{border:1px solid #393640;border-radius:18px;padding:18px;margin:14px 0}article h2{font-size:20px;margin:0}ol{padding-left:24px}li{margin:8px 0}#status{border-radius:16px;background:#25232c;padding:18px}#error{color:#ff9c9c;white-space:pre-wrap}details{color:#b5b3bf;max-height:350px;overflow:auto}small{color:#b5b3bf}
</style><h1>歌单导入助手</h1>
<p>手机保存歌单，电脑客户端下载音乐，再校验并导入同一个服务器。</p>
<ol><li>在手机「发现 → 导入外部歌单」粘贴链接，匹配后保存服务器歌单。</li><li>刷新下面的任务，在已登录的 QQ／网易云官方客户端中下载对应歌单。此助手不会代替客户端登录、购买或下载。</li><li>下载完成后点击「校验并入库」。回到手机手动更新歌单，补齐刚入库的歌曲。</li></ol>
<button id="refresh">刷新手机任务</button><button id="start">校验并入库</button><p id="status">正在连接本机助手…</p><p id="error"></p><section id="jobs"></section>
<small>仅监听本机；沿用已有 mini_server SSH 和音乐入库工具。平台账号与登录信息不发送给音乐服务器。源音频和服务器已有音乐均保留。</small>
<script>
const $=id=>document.getElementById(id);let posting=false,actionError='',renderedJobs='';
async function render(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('助手未连接');const s=await r.json();$('status').textContent=s.message;$('refresh').disabled=$('start').disabled=posting||s.running;$('error').textContent=actionError||(s.issues||[]).join('\n');const signature=JSON.stringify(s.jobs);if(signature===renderedJobs)return;renderedJobs=signature;$('jobs').replaceChildren();for(const j of s.jobs){const box=document.createElement('article'),title=document.createElement('h2'),summary=document.createElement('p'),link=document.createElement('a'),details=document.createElement('details'),cap=document.createElement('summary'),list=document.createElement('ol');title.textContent=j.name;summary.textContent=(j.provider==='QQ'?'QQ 音乐':'网易云音乐')+' · '+j.missing.length+' 首待补齐';if(j.url){link.textContent='打开来源歌单，进入官方客户端下载';link.href=j.url;link.target='_blank';link.rel='noopener noreferrer'}else{link.textContent='在官方客户端搜索下列歌曲并下载';link.removeAttribute('href')}cap.textContent='查看待下载歌曲';details.append(cap,list);for(const t of j.missing){const item=document.createElement('li');item.textContent=t.title+' — '+t.artists.join(' / ');list.append(item)}box.append(title,summary,link,details);$('jobs').append(box)}}catch(e){$('error').textContent=e.message}}
async function action(path){posting=true;actionError='';$('refresh').disabled=$('start').disabled=true;try{const r=await fetch(path,{method:'POST',headers:{'X-Tempus-Import':'1'}}),s=await r.json();if(!r.ok)throw Error(s.error||'操作失败')}catch(e){actionError=e.message}finally{posting=false;await render()}}
$('refresh').onclick=()=>action('/api/refresh');$('start').onclick=()=>action('/api/start');render();setInterval(render,1800);
</script></html>
