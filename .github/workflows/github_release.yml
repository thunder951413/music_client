name: Release

# Push a tag v<version> matching musicClientVersion in gradle.properties to publish a signed
# APK as the latest GitHub release; the app's update check reads that release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches musicClientVersion
        run: |
          version=$(sed -n 's/^musicClientVersion=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match musicClientVersion=${version} in gradle.properties"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MUSIC_CLIENT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUSIC_CLIENT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUSIC_CLIENT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MUSIC_CLIENT_KEYSTORE="$RUNNER_TEMP/release.jks"
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          chmod +x ./gradlew
          ./gradlew assembleDegoogledRelease

          out=app/build/outputs/apk/degoogled/release
          apk=$(ls "$out"/*universal*-release.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls "$out"/*-release.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "No signed release APK in $out:"; ls -la "$out"; exit 1
          fi
          cp "$apk" "music_client-${VERSION}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: music_client-${{ env.VERSION }}.apk
