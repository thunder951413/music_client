name: Playlist import helper tests

on:
  push:
    branches: [main, custom, development]
    paths: ['tools/playlist_import/**', '.github/workflows/playlist_import.yml']
  pull_request:
    paths: ['tools/playlist_import/**', '.github/workflows/playlist_import.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run playlist_import unit tests
        run: python3 -m unittest discover -s tools/playlist_import -p 'test_*.py' -v
